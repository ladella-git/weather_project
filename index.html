<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"날씨로 우울할 필요 없어, 날씨보다 축구가 더 중요" - 일기예보</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">

    <link rel="stylesheet" href="./css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body data-weather="sunny">
    <section class="hero-photo">
        <div class="hero-inner">
            <h1 class="hero-title">일기 예보 페이지</h1>
            <form action="" id="searcheForm" class="search-form">
                <input type="text" id="cityInput" placeholder="도시 이름 검색(예시: 광주)" autocomplete="off">
                <button type="submit">검색</button>
            </form>
        </div>
    </section>

    <!-- 홈 화면 -->
     <div id="screen-home" class="screen">
        <div class="page-content">
            <div class="page-content-inner">
                <div class="home-top">
                    <!-- 내 위치 날씨 -->
                    <section id="myLocation" class="my-location">
                        <button type="buton" id="myLocationBtn" class="my-location">
                            내 위치 날씨 보기
                        </button>
                        <p class="my-location-hint">
                            위치를 허용하면 내 동내의 현재 날씨가 여기에 표시돼요.
                        </p>
                    </section>
                
                    <!-- 전국 최고/최저 기온 -->
                     <div class="home-top-right">
                        <h2 class="section-title">오늘의 전국 최고/최저</h2>
                        <div id="extremRow" class="extream-row">
                            <button type="button" class="extream-card">
                                <span class="extream-label">오늘 가장 더운 곳</span>
                                <span class="extream-value">강릉 39°</span>
                            </button>
                            <button type="button" class="extream-card">
                                <span class="extream-label">오늘 가장 추운 곳</span>
                                <span class="extream-value">대전 23°</span>
                            </button>
                        </div>
                    </div>

                </div>
                
                <div class="footer-home"></div>

            </div>
        </div>
     </div>
        

     <div id="screen-detail" class="screen" hidden></div>
     
</body>
</html>
